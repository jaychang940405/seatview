<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SeatView</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b1d23;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      .hud {
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.6);
        color: #f0f0f0;
        font: 14px/1.5 system-ui, sans-serif;
      }
      .hud button,
      .hud select,
      .hud input {
        font: inherit;
      }
      [hidden] {
        display: none !important;
      }

      /* 左上：選位面板（可收合） */
      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        max-width: 380px;
        padding: 8px 12px;
      }
      #panel .panel-head {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      #panel-toggle {
        padding: 2px 8px;
        cursor: pointer;
      }
      #panel:not(.collapsed) .summary {
        display: none;
      }
      #panel .panel-body {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 6px 10px;
        align-items: center;
        margin-top: 8px;
      }
      #panel select {
        width: 100%;
      }
      #panel .stepper {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #panel .stepper button {
        width: 2em;
        cursor: pointer;
      }
      #panel input[type="number"] {
        width: 4.5em;
      }
      #panel input:invalid {
        outline: 2px solid #ff6b6b;
      }
      #panel .hint {
        margin-left: 4px;
        color: #b8bcc6;
        white-space: nowrap;
      }

      /* 右上：場地切換（分段按鈕） */
      #layout-switch {
        position: fixed;
        top: 12px;
        right: 12px;
        display: flex;
        padding: 3px;
      }
      #layout-switch label {
        position: relative;
        padding: 4px 12px;
        border-radius: 4px;
        cursor: pointer;
      }
      #layout-switch input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      #layout-switch label:has(input:checked) {
        background: #f0f0f0;
        color: #111;
      }
      #layout-switch label:has(input:focus-visible) {
        outline: 2px solid #8ab4f8;
      }

      /* 下方：小地圖、視角工具、資訊列 */
      #hud-bottom {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
      }
      #hud-row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }
      #hud-row > * {
        pointer-events: auto;
      }
      #view-tools {
        margin-left: auto;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 6px 10px;
        font-size: 13px;
      }
      #view-tools button {
        padding: 2px 10px;
        cursor: pointer;
      }
      #zoom-presets {
        display: flex;
        gap: 4px;
      }
      #view-tools button[aria-pressed="true"] {
        background: #f0f0f0;
        color: #111;
        font-weight: 600;
      }
      #view-hint {
        flex-basis: 100%;
        color: #b8bcc6;
        font-size: 12px;
      }
      #info {
        padding: 8px 12px;
      }
      #info .notice {
        color: #ffd166;
      }
      #info .error {
        color: #ff9b9b;
      }
      #info .disclaimer {
        color: #b8bcc6;
        font-size: 12px;
      }

      /* 手機：上方的場地切換＋面板合計不超過畫面高度的 1/3 */
      @media (max-width: 600px) {
        .hud {
          font-size: 13px;
        }
        #layout-switch {
          top: 8px;
          right: 8px;
        }
        #panel {
          top: 52px;
          left: 8px;
          right: 8px;
          max-width: none;
          max-height: calc(33vh - 52px);
          overflow-y: auto;
          padding: 6px 10px;
        }
        #panel .panel-body {
          gap: 4px 8px;
        }
        #hud-bottom {
          left: 8px;
          right: 8px;
          bottom: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <form id="panel" class="hud" aria-label="選擇座位"></form>
    <div id="layout-switch" class="hud"></div>
    <div id="hud-bottom">
      <div id="hud-row">
        <div id="view-tools" class="hud" hidden>
          <span id="zoom-presets" role="group" aria-label="倍數"></span>
          <button type="button" id="reset-view" hidden>回正</button>
          <span id="view-hint"></span>
        </div>
      </div>
      <div id="info" class="hud" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
